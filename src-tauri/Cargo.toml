[package]
name = "ytp_music_player"
version = "0.1.1"
description = "YouTube Music title catcher with OBS overlays and session credits"
authors = ["Frank"]
edition = "2021"

[lib]
name = "ytp_music_player_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.3.0", features = [] }

[dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.6.0", features = [] }
tauri-plugin-opener = "2.2.0"
tiny_http = "0.12"
urlencoding = "2.1"
